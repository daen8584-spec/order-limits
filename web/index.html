<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="shopify-api-key" content="%SHOPIFY_API_KEY%" />
    <meta name="app-handle" content="%APP_HANDLE%" />
    <title>Order Limits</title>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <s-page heading="Order Limits">
      <div id="banners"></div>
      <s-section id="status-section">
        <s-stack gap="base">
          <s-text id="status">…</s-text>
          <s-stack direction="inline" gap="small">
            <s-button id="primary" variant="primary" hidden></s-button>
            <s-button id="edit" hidden></s-button>
          </s-stack>
          <s-text id="action-error" tone="critical" hidden></s-text>
        </s-stack>
      </s-section>
      <s-section id="how-section">
        <s-ordered-list id="how"></s-ordered-list>
      </s-section>
      <s-section id="plan-section">
        <s-stack gap="base">
          <s-text id="plan"></s-text>
          <s-button id="plans"></s-button>
        </s-stack>
      </s-section>
    </s-page>
  </body>
</html>
