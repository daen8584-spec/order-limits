query Input($collectionIds: [ID!]! = []) {
  buyerJourney {
    step
  }
  presentmentCurrencyRate
  localization {
    language {
      isoCode
    }
  }
  validation {
    metafield(namespace: "$app:order-limits", key: "config") {
      jsonValue
    }
  }
  cart {
    cost {
      subtotalAmount {
        amount
        currencyCode
      }
    }
    lines {
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            title
            inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
}
