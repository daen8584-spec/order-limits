name: Deploy

# Runs on every push to main, and by hand from the Actions tab.
# Each part is skipped until its keys are added (see SETUP.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHOPIFY_API_SECRET: ${{ secrets.SHOPIFY_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm ci && npm test
      - name: Deploy to Cloudflare (free plan)
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: >
          npx wrangler deploy
          --var SHOPIFY_API_KEY:"${{ vars.SHOPIFY_API_KEY }}"
          --var APP_HANDLE:"${{ vars.APP_HANDLE }}"
          --var SERVICE_NOTICE:"${{ vars.SERVICE_NOTICE }}"
      - name: Store the app secret
        if: env.CLOUDFLARE_API_TOKEN != '' && env.SHOPIFY_API_SECRET != ''
        run: printf '%s' "$SHOPIFY_API_SECRET" | npx wrangler secret put SHOPIFY_API_SECRET
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Cloudflare keys not added yet; skipped."

  shopify:
    runs-on: ubuntu-latest
    needs: cloudflare
    env:
      SHOPIFY_SERVICE_ACCOUNT_TOKEN: ${{ secrets.SHOPIFY_SERVICE_ACCOUNT_TOKEN }}
      SHOPIFY_API_KEY: ${{ vars.SHOPIFY_API_KEY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Deploy checkout rule, settings screen and app settings to Shopify
        if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          rustup target add wasm32-unknown-unknown
          npm ci
          node scripts/configure.mjs
          npx shopify app deploy --allow-updates --source-control-url "${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
      - if: env.SHOPIFY_SERVICE_ACCOUNT_TOKEN == ''
        run: echo "Shopify token not added yet; skipped."
