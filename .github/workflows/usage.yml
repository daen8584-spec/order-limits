name: Cloudflare usage

# Every 4 hours: opens an issue when the day's Worker requests pass 60% of the
# free plan's daily limit.
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check today's usage
        id: usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          node scripts/usage.mjs > usage.txt
          code=$?
          cat usage.txt
          [ $code -eq 2 ] && echo "warn=true" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] || [ $code -eq 2 ]
      - name: Open an issue
        if: steps.usage.outputs.warn == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Cloudflare free limit: time to upgrade";
            const open = await github.rest.issues.listForRepo({ ...context.repo, state: "open" });
            if (open.data.some((i) => i.title === title)) return;
            const body = require("fs").readFileSync("usage.txt", "utf8");
            await github.rest.issues.create({ ...context.repo, title, body });
